[project]
name = "buscomipana"
version = "0.1.0"
description = "Backend for Buscomipana: phone-based ping/pong safety-check and missing-person matching platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "celery>=5.4",
    "redis>=5.1",
    "slowapi>=0.1.9",
    "sqladmin>=0.20",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "pillow>=11.0",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "piexif>=1.1.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# B008: Depends(...)/Header(...) in argument defaults is FastAPI's idiomatic DI
# pattern, not a bug. RUF012: SQLAdmin's ModelView.column_list = [...] is its
# documented configuration style, not a mutable-default hazard (it's a class
# attribute read by the library, never mutated).
ignore = ["B008", "RUF012"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
