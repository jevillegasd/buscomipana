server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors backend/app/core/security_headers.py -- same baseline on both
    # halves of the app. connect-src is 'self' only because production routes
    # /api/* through the same public origin as this app (see ../Caddyfile),
    # so the browser never needs to reach a separate API domain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # img-src allows blob: -- profile/report photos are fetched via an
    # authenticated request and displayed through URL.createObjectURL
    # (see frontend/src/hooks/useAuthenticatedImage.ts and
    # components/ImageCropModal.tsx), never a plain <img src="/api/...">,
    # so the browser needs blob: to render either.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Service worker / manifest must never be cached long-term, or an update
    # to the PWA can get stuck on a stale worker indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Hashed build assets (Vite's default output naming) are safe to cache
    # forever -- a new deploy ships new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any other path (client-side routes like /profile,
    # /relatives) serves index.html and lets React Router take over.
    location / {
        try_files $uri /index.html;
    }
}
